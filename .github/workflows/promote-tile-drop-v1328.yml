name: Promote tile drop animation v13.28
on:
  push:
    paths:
      - '.github/workflows/promote-tile-drop-v1328.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested tile drop animation
        shell: python
        run: |
          from pathlib import Path
          import urllib.request
          base='https://raw.githubusercontent.com/gunpowderstudios/BOD3D-TEST/main/'
          for path in ['js/scene3d.js','js/game.js']:
              data=urllib.request.urlopen(base+path).read().decode('utf-8')
              Path(path).write_text(data)
          p=Path('index.html')
          s=p.read_text()
          import re
          s=re.sub(r'data-build-version="v[0-9.]+"','data-build-version="v13.28"',s,count=1)
          p.write_text(s)
      - name: Commit LIVE v13.28
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add js/scene3d.js js/game.js index.html
          git commit -m "Promote tested tile drop animation v13.28"
          git push
