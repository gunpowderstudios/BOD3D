name: BOD3D LIVE v13.61 Rules promotion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote approved Rules UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          # game.js — add the approved compact Rules popup and replace only
          # the hamburger-menu North Up entry. The on-screen North Up control remains.
          p='js/game.js'; s=read(p)
          marker='}\nfunction openMenu(){'
          rules='''}
function openRules(){
  showModal('HOW TO PLAY','',[{text:'Close',fn:closeModal}]);
  document.getElementById('modalBody').innerHTML=`
    <div style="max-height:min(62dvh,560px);overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:left;line-height:1.35;padding:2px 6px 4px;white-space:normal">
      <div><b style="color:#E9BA00">Your Quest</b><br>Find the <b>Ring</b>, defeat the <b>Red Dragon</b> and exit the dungeon!</div>
      <div><b style="color:#E9BA00">Explore the Dungeon</b><br>Use the <b>N, S, E and W</b> controls to move. When there is no dungeon tile in that direction, you will draw and place a new one. The dungeon is different every game.</div>
      <div><b style="color:#E9BA00">Fight Monsters</b><br>Enter a tile containing a monster and combat begins. Roll your dice, use your weapons and items, and reduce the monster to <b>0 Health</b> before it does the same to you.</div>
      <div><b style="color:#E9BA00">Find Treasure</b><br>Defeated monsters may reward you with weapons, armour, spells, potions and other useful items. Equip the ones that best suit your adventurer.</div>
      <div><b style="color:#E9BA00">Find the Ring</b><br>Somewhere in the dungeon is the <b>Ring</b>. You must find and collect it before you can complete your quest.</div>
      <div><b style="color:#E9BA00">Defeat the Red Dragon</b><br>The Dragon guards the Exit. Find the Ring, defeat the Dragon and reach the Exit to escape the dungeon.</div>
      <div><b style="color:#E9BA00">Death</b><br>Lose all your Health and your adventure may be over — although a few special items might save your skin!</div>
      <div style="text-align:center"><b>One life, one chance and one more forgotten hero!</b></div>
    </div>`;
}
function openMenu(){'''
          s=once(s,marker,rules,'openRules insertion point')

          old='''    {text:'North Up',fn:()=>{
      closeModal();
      window.BOD3D?.northUp?.();
      resetCameraHeroTracking();
    }},'''
          new="""    {text:'Rules',fn:()=>{closeModal();openRules();}},"""
          s=once(s,old,new,'hamburger North Up item')
          write(p,s)

          # index.html — LIVE build/version and cache busting only.
          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.59"','data-build-version="v13.61"','LIVE build version')
          s=once(s,'js/game.js?cache=20260807-live-v1319','js/game.js?cache=20260813-live-v1361','game cache')
          s=once(s,'js/ui.js?v=13.59','js/ui.js?v=13.61','ui cache')
          write(p,s)

          # ui.js — synchronise the visible LIVE build number.
          p='js/ui.js'; s=read(p)
          s=once(s,'// Live v13.59 — approved TEST UI changes promoted to Live.','// Live v13.61 — approved Rules menu and compact formatting promoted to Live.','ui comment')
          s=once(s,"const version='v13.59';","const version='v13.61';",'ui version')
          write(p,s)

          # Validation.
          game=read('js/game.js'); idx=read('index.html'); ui=read('js/ui.js')
          rs=game[game.index('function openRules(){'):game.index('\nfunction openMenu(){',game.index('function openRules(){'))]
          assert rs.count('#E9BA00') == 7
          assert '<p' not in rs and '</p>' not in rs
          assert 'white-space:normal' in rs
          assert "{text:'Rules',fn:()=>{closeModal();openRules();}}," in game
          assert "{text:'North Up',fn:()=>{" not in game
          assert "document.getElementById('northUpBtn').onclick" in game
          assert 'data-build-version="v13.61"' in idx
          assert 'js/game.js?cache=20260813-live-v1361' in idx
          assert 'js/ui.js?v=13.61' in idx
          assert 'noindex' not in idx.lower()
          assert "const version='v13.61';" in ui
          print('LIVE v13.61 validated: approved Rules promotion only')
          PY

      - name: Commit approved LIVE v13.61
        shell: bash
        run: |
          rm -f .github/workflows/promote-rules-v1361.yml
          git config user.name "BOD3D LIVE updater"
          git config user.email "actions@users.noreply.github.com"
          git add js/game.js index.html js/ui.js .github/workflows/promote-rules-v1361.yml
          git diff --cached --check
          git commit -m "v13.61: promote approved Rules menu to live"
          git push
