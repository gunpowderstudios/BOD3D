name: One-shot max image preview update

on:
  push:
    paths:
      - '.github/workflows/max-image-preview-update.yml'

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add max-image-preview meta tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'name="robots" content="max-image-preview:large"' in s:
              raise SystemExit('Tag already present')
          old = '<meta name="theme-color" content="#000000" />\n'
          new = old + '<meta name="robots" content="max-image-preview:large" />\n'
          if old not in s:
              raise SystemExit('Expected theme-color tag not found')
          s = s.replace('data-build-version="v13.70"', 'data-build-version="v13.71"', 1)
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Allow large image previews in search"
          git push origin main
