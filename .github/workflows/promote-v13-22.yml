name: Promote tested v13.22 to LIVE
on:
  push:
    paths:
      - '.github/workflows/promote-v13-22.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote verified TEST changes
        shell: python
        run: |
          from pathlib import Path

          g=Path('js/game.js')
          s=g.read_text()
          old='''function render(){\n if(!state)return;\n document.getElementById('stats').innerHTML=`<div class="sectionTitle">${state.charDef?state.charDef.name:'Adventurer'}</div><div class="row"><span>Health</span><b class="hp">${state.player.health}/${state.player.maxHealth}</b></div><div class="hearts">${heartLine(state.player.health,state.player.maxHealth)}</div><div class="row"><span>AP</span><b class="ap">${state.player.ap}/${state.player.maxAp}</b></div><div class="statline">Combat: ${pDice()}d6+${pCombatMod()} &nbsp; Armour: -${pDamageReduction()}</div><div class="statline">Lives: ${state.player.lives} &nbsp; Ring: ${state.player.hasRing?`<span class="ringStatus">${iconHTML('Ring','◎')}<b>YES</b></span>`:'no'}</div>`;\n'''
          new='''function refreshPlayerStatsPanel(){\n if(!state?.player)return;\n const stats=document.getElementById('stats');\n if(stats)stats.innerHTML=`<div class="sectionTitle">${state.charDef?state.charDef.name:'Adventurer'}</div><div class="row"><span>Health</span><b class="hp">${state.player.health}/${state.player.maxHealth}</b></div><div class="hearts">${heartLine(state.player.health,state.player.maxHealth)}</div><div class="row"><span>AP</span><b class="ap">${state.player.ap}/${state.player.maxAp}</b></div><div class="statline">Combat: ${pDice()}d6+${pCombatMod()} &nbsp; Armour: -${pDamageReduction()}</div><div class="statline">Lives: ${state.player.lives} &nbsp; Ring: ${state.player.hasRing?`<span class="ringStatus">${iconHTML('Ring','◎')}<b>YES</b></span>`:'no'}</div>`;\n const mobileStatus=document.getElementById('mobileStatus');\n if(mobileStatus){\n  mobileStatus.innerHTML=`\n   <div class="mobileHero">${state.charDef?.name||'Adventurer'}</div>\n   <span>♥ ${state.player.health}/${state.player.maxHealth}</span>\n   <span>AP ${state.player.ap}/${state.player.maxAp}</span>\n   <span>🎒 ${occupiedSpaceCount()}/8</span>\n   <span>${state.player.hasRing?'Ring ✓':'Ring —'}</span>\n   <div class="mobileDecks">Tiles ${state.tileDeck.length} · Monsters ${state.monsterDeck.length} · Items ${state.itemDeck.length}</div>`;\n }\n}\nfunction render(){\n if(!state)return;\n refreshPlayerStatsPanel();\n'''
          if old not in s: raise SystemExit('render stats block not found')
          s=s.replace(old,new,1)
          old_mobile=''' const mobileStatus=document.getElementById('mobileStatus');\n if(mobileStatus){\n  mobileStatus.innerHTML=`\n   <div class="mobileHero">${state.charDef?.name||'Adventurer'}</div>\n   <span>♥ ${state.player.health}/${state.player.maxHealth}</span>\n   <span>AP ${state.player.ap}/${state.player.maxAp}</span>\n   <span>🎒 ${occupiedSpaceCount()}/8</span>\n   <span>${state.player.hasRing?'Ring ✓':'Ring —'}</span>\n   <div class="mobileDecks">Tiles ${state.tileDeck.length} · Monsters ${state.monsterDeck.length} · Items ${state.itemDeck.length}</div>`;\n }\n'''
          if old_mobile not in s: raise SystemExit('mobile block not found')
          g.write_text(s.replace(old_mobile,'',1))

          c=Path('js/combat.js')
          s=c.read_text()
          old=""" combat.rolling=false;\n combat.mustFightRound=false;\n document.getElementById('combatLog').textContent=text;\n"""
          new=""" combat.rolling=false;\n combat.mustFightRound=false;\n refreshPlayerStatsPanel();\n document.getElementById('combatLog').textContent=text;\n"""
          if old not in s: raise SystemExit('combat insertion point not found')
          c.write_text(s.replace(old,new,1))

          i=Path('index.html')
          h=i.read_text()
          h=h.replace('data-build-version="v13.21"','data-build-version="v13.22"',1)
          h=h.replace('js/game.js?cache=20260807-combat-pulse-v1316','js/game.js?cache=20260807-health-hud-v1322',1)
          h=h.replace('js/combat.js?cache=20260807-run-warning-v1321','js/combat.js?cache=20260807-health-hud-v1322',1)
          i.write_text(h)
      - name: Commit LIVE v13.22
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add js/game.js js/combat.js index.html
          git commit -m "Promote combat Health HUD refresh v13.22 to LIVE"
          git push
