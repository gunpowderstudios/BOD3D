name: BOD3D LIVE v13.63 Short Story menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote Short Story menu
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          p='js/game.js'; s=read(p)
          story_marker='// Consolidated in TEST v12.74: Firkin quest introduction story and ending-scroll guard.'
          story_start=s.index(story_marker)
          array_start=s.index('  const paragraphs = [',story_start)
          array_end=s.index('\n  ];',array_start)+5
          if 'window.BOD3D_SHORT_STORY' in s:
              raise SystemExit('Short Story exposure already exists')
          s=s[:array_end]+'\n  window.BOD3D_SHORT_STORY = paragraphs.slice();'+s[array_end:]

          menu_marker='\nfunction openMenu(){'
          if s.count(menu_marker) != 1:
              raise SystemExit(f'openMenu marker: expected 1, found {s.count(menu_marker)}')
          story_fn=("\nfunction openShortStory(){\n"
                    "  showModal('THE SHORT STORY','',[{text:'Close',fn:closeModal}]);\n"
                    "  const body=document.getElementById('modalBody');\n"
                    "  if(!body)return;\n"
                    "  const wrap=document.createElement('div');\n"
                    "  wrap.style.cssText='max-height:min(62dvh,560px);overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:left;line-height:1.4;padding:2px 6px 4px;white-space:normal;display:grid;gap:8px';\n"
                    "  const paragraphs=Array.isArray(window.BOD3D_SHORT_STORY)?window.BOD3D_SHORT_STORY:[];\n"
                    "  paragraphs.forEach(text=>{\n"
                    "    const row=document.createElement('div');\n"
                    "    row.textContent=text;\n"
                    "    wrap.appendChild(row);\n"
                    "  });\n"
                    "  body.innerHTML='';\n"
                    "  body.appendChild(wrap);\n"
                    "}\n")
          s=s.replace(menu_marker,story_fn+menu_marker,1)
          s=once(s,"    {text:'Rules',fn:()=>{closeModal();openRules();}},\n    {text:'About',fn:()=>{closeModal();openAbout();}},","    {text:'Rules',fn:()=>{closeModal();openRules();}},\n    {text:'The Short Story',fn:()=>{closeModal();openShortStory();}},\n    {text:'About',fn:()=>{closeModal();openAbout();}},",'Short Story menu item')
          write(p,s)

          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.62"','data-build-version="v13.63"','build version')
          s=once(s,'js/game.js?cache=20260813-live-v1362','js/game.js?cache=20260813-live-v1363','game cache')
          s=once(s,'js/ui.js?v=13.62','js/ui.js?v=13.63','ui cache')
          write(p,s)

          p='js/ui.js'; s=read(p)
          s=once(s,'// Live v13.62 — approved Action Points rule promoted to Live.','// Live v13.63 — approved The Short Story menu promoted to Live.','ui comment')
          s=once(s,"const version='v13.62';","const version='v13.63';",'ui version')
          write(p,s)

          game=read('js/game.js'); idx=read('index.html'); ui=read('js/ui.js')
          assert game.count('window.BOD3D_SHORT_STORY = paragraphs.slice();') == 1
          assert game.count('function openShortStory(){') == 1
          assert "showModal('THE SHORT STORY'" in game
          assert "{text:'The Short Story',fn:()=>{closeModal();openShortStory();}}," in game
          assert "heading.textContent = 'A SHORT STORY…';" in game
          assert "document.querySelectorAll('.testerWarningScroll').forEach(appendStory);" in game
          assert 'display:grid;gap:8px' in game
          assert 'data-build-version="v13.63"' in idx
          assert 'js/game.js?cache=20260813-live-v1363' in idx
          assert 'js/ui.js?v=13.63' in idx
          assert "const version='v13.63';" in ui
          assert 'noindex' not in idx.lower()
          print('LIVE v13.63 validated: Short Story menu promoted; opening parchment unchanged')
          PY

      - name: Commit validated LIVE v13.63
        shell: bash
        run: |
          rm -f .github/workflows/promote-story-v1363.yml
          git config user.name "BOD3D LIVE updater"
          git config user.email "actions@users.noreply.github.com"
          git add js/game.js index.html js/ui.js .github/workflows/promote-story-v1363.yml
          git diff --cached --check
          git commit -m "v13.63: add The Short Story to live menu"
          git push
