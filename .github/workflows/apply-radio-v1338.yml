name: Apply Dungeon Radio rename v13.38
on:
  push:
    paths:
      - '.github/workflows/apply-radio-v1338.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/patch-radio-v1338.py
      - run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add js/audio.js index.html
          git commit -m "Rename Dungeon Radio track to Welcome to the Dungeon v13.38"
          git push
