name: BOD3D LIVE v13.62 Action Points rule

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote approved Action Points rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          p='js/game.js'; s=read(p)
          fight='      <div><b style="color:#E9BA00">Fight Monsters</b><br>Enter a tile containing a monster and combat begins. Roll your dice, use your weapons and items, and reduce the monster to <b>0 Health</b> before it does the same to you.</div>'
          ap='      <div><b style="color:#E9BA00">Action Points (AP)</b><br>AP are used <b>only during combat</b>. Some weapons, items and spells cost AP to use. If you run out of AP, you can still fight, but you’ll be limited to <b>melee attacks</b>.</div>'
          s=once(s,fight,fight+'\n'+ap,'Action Points insertion')
          write(p,s)

          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.61"','data-build-version="v13.62"','LIVE build version')
          s=once(s,'js/game.js?cache=20260813-live-v1361','js/game.js?cache=20260813-live-v1362','game cache')
          s=once(s,'js/ui.js?v=13.61','js/ui.js?v=13.62','ui cache')
          write(p,s)

          p='js/ui.js'; s=read(p)
          s=once(s,'// Live v13.61 — approved Rules menu and compact formatting promoted to Live.','// Live v13.62 — approved Action Points rule promoted to Live.','ui comment')
          s=once(s,"const version='v13.61';","const version='v13.62';",'ui version')
          write(p,s)

          game=read('js/game.js'); idx=read('index.html'); ui=read('js/ui.js')
          rs=game[game.index('function openRules(){'):game.index('\nfunction openMenu(){',game.index('function openRules(){'))]
          assert rs.count('Action Points (AP)') == 1
          assert 'AP are used <b>only during combat</b>' in rs
          assert 'limited to <b>melee attacks</b>' in rs
          assert rs.count('#E9BA00') == 8
          assert 'data-build-version="v13.62"' in idx
          assert 'js/game.js?cache=20260813-live-v1362' in idx
          assert 'js/ui.js?v=13.62' in idx
          assert 'noindex' not in idx.lower()
          assert "const version='v13.62';" in ui
          print('LIVE v13.62 validated: approved Action Points rule only')
          PY

      - name: Commit approved LIVE v13.62
        shell: bash
        run: |
          rm -f .github/workflows/promote-ap-v1362.yml
          git config user.name "BOD3D LIVE updater"
          git config user.email "actions@users.noreply.github.com"
          git add js/game.js index.html js/ui.js .github/workflows/promote-ap-v1362.yml
          git diff --cached --check
          git commit -m "v13.62: add Action Points to live Rules"
          git push
