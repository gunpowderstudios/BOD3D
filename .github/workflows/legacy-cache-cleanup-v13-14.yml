name: Apply legacy cache cleanup v13.14

on:
  push:
    paths:
      - '.github/workflows/legacy-cache-cleanup-v13-14.yml'

permissions:
  contents: write

jobs:
  patch-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('data-build-version="v13.13"','data-build-version="v13.14"',1)
          marker='<head>\n'
          cleanup='''<script>\n// v13.14: retire legacy BOD3D PWA/service-worker caches that can pin old builds.\n(function(){\n  const appName=(location.pathname.split('/').filter(Boolean)[0]||'BOD3D');\n  const scopeToken='/'+appName+'/';\n  if('serviceWorker' in navigator){\n    window.addEventListener('load',function(){\n      navigator.serviceWorker.getRegistrations().then(function(registrations){\n        registrations.forEach(function(reg){\n          if((reg.scope||'').includes(scopeToken)) reg.unregister();\n        });\n      }).catch(function(){});\n    },{once:true});\n  }\n  if('caches' in window){\n    caches.keys().then(function(keys){\n      keys.forEach(function(key){\n        if(/bod|dungeon|pwa/i.test(key)) caches.delete(key);\n      });\n    }).catch(function(){});\n  }\n})();\n</script>\n'''
          if 'v13.14: retire legacy BOD3D PWA/service-worker caches' not in s:
              s=s.replace(marker,marker+cleanup,1)
          p.write_text(s)
      - name: Commit LIVE v13.14
        run: |
          git config user.name "Gunpowder Studios Deploy"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add index.html
          git commit -m "Fix legacy service-worker cache and publish LIVE v13.14"
          git push
