name: BOD3D LIVE sync approved parchment

on:
  push:
    paths:
      - '.github/workflows/sync-scroll-v1369.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy approved TEST parchment to LIVE
        run: |
          curl -fsSL "https://raw.githubusercontent.com/gunpowderstudios/BOD3D-TEST/main/assets/ui/scroll.png" -o assets/ui/scroll.png
          actual="$(git hash-object assets/ui/scroll.png)"
          expected="0e1e58645745991308427a0a8a2ac2bba2a45d52"
          if [ "$actual" != "$expected" ]; then
            echo "scroll.png hash mismatch: $actual"
            exit 1
          fi
          rm .github/workflows/sync-scroll-v1369.yml
          python - <<'PY'
          import subprocess
          allowed={'.github/workflows/sync-scroll-v1369.yml','assets/ui/scroll.png'}
          changed=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          extra=changed-allowed
          missing=allowed-changed
          if extra or missing:
              raise SystemExit(f'Unexpected diff. extra={sorted(extra)} missing={sorted(missing)}')
          PY
          git diff --check

      - name: Commit corrected LIVE parchment
        run: |
          git config user.name "BOD3D LIVE updater"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "v13.69: sync approved parchment asset to live"
          git push
