name: Apply lunge-only combat v13.27
on:
  push:
    paths:
      - '.github/workflows/apply-lunge-only-v1327.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove combat rotation and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/scene3d.js')
          s=p.read_text()
          old=re.compile(r"\n\s*const heroSwiping=.*?\n\s*monster\.rotation\.y=yawTowards\(monster\.position,hero\.position\)-\(monsterSwiping\?swipeAngle:0\);",re.S)
          new="\n   // Combat attack animation is now a pure tabletop lunge: both miniatures\n   // stay facing one another while moving forward and back, with no swing rotation.\n   hero.rotation.y=yawTowards(hero.position,monster.position);\n   monster.rotation.y=yawTowards(monster.position,hero.position);"
          s,n=old.subn(new,s,count=1)
          if n!=1:
              raise SystemExit('combat rotation block not found')
          # Remove now-unused swipe-angle calculation block while preserving lunge logic.
          s=s.replace('   let swipeAngle=0;\n','')
          s=re.sub(r"\n\s*const fullSwipe=THREE\.MathUtils\.degToRad\(45\);.*?\n\s*}\n\s*}\n\n\s*const heroAttackDirection", "\n    }\n   }\n\n   const heroAttackDirection", s, count=1, flags=re.S)
          p.write_text(s)
          i=Path('index.html')
          x=i.read_text()
          x=re.sub(r'data-build-version="v[0-9.]+"','data-build-version="v13.27"',x,count=1)
          i.write_text(x)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/scene3d.js index.html
          git commit -m 'v13.27 lunge-only combat animation'
          git push
