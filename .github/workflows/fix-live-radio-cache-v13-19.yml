name: Fix live radio and cache tags v13.19
on:
  push:
    paths:
      - '.github/workflows/fix-live-radio-cache-v13-19.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live audio and cache tags
        shell: python
        run: |
          from pathlib import Path
          a=Path('js/audio.js')
          s=a.read_text()
          old="""    {\n      number:2,\n      file:'./assets/radio/02-burn-the-world-waltz.mp3',\n      title:'Burn The World Waltz',\n      artist:'Kevin MacLeod',\n      artistUrl:'https://incompetech.com/',\n      licence:'Creative Commons Attribution 4.0',\n      licenceUrl:'https://creativecommons.org/licenses/by/4.0/'\n    }\n  ];"""
          new="""    {\n      number:2,\n      file:'./assets/radio/02-burn-the-world-waltz.mp3',\n      title:'Burn The World Waltz',\n      artist:'Kevin MacLeod',\n      artistUrl:'https://incompetech.com/',\n      licence:'Creative Commons Attribution 4.0',\n      licenceUrl:'https://creativecommons.org/licenses/by/4.0/'\n    },\n    {\n      number:3,\n      file:'./assets/radio/03-gearhead.mp3',\n      title:'Gearhead',\n      artist:'Kevin MacLeod',\n      artistUrl:'https://incompetech.com/',\n      licence:'Creative Commons Attribution 4.0',\n      licenceUrl:'https://creativecommons.org/licenses/by/4.0/'\n    },\n    {\n      number:4,\n      file:'./assets/radio/04-exhilarate.mp3',\n      title:'Exhilarate',\n      artist:'Kevin MacLeod',\n      artistUrl:'https://incompetech.com/',\n      licence:'Creative Commons Attribution 4.0',\n      licenceUrl:'https://creativecommons.org/licenses/by/4.0/'\n    }\n  ];"""
          if old not in s:
              raise SystemExit('Expected two-track radio block not found')
          s=s.replace(old,new,1).replace("?radio-check=13.02","?radio-check=13.19")
          a.write_text(s)

          i=Path('index.html')
          h=i.read_text()
          h=h.replace('data-build-version="v13.18"','data-build-version="v13.19"',1)
          h=h.replace('js/game.js?cache=20260807-combat-pulse-v1316','js/game.js?cache=20260807-live-v1319',1)
          h=h.replace('js/combat.js?cache=20260807-combat-pulse-v1316','js/combat.js?cache=20260807-live-v1319',1)
          h=h.replace('js/scene3d.js?cache=20260807-combat-pulse-v1316','js/scene3d.js?cache=20260807-live-v1319',1)
          h=h.replace('js/audio.js?v=13.02','js/audio.js?v=13.19',1)
          i.write_text(h)
      - name: Commit fix
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add index.html js/audio.js
          git commit -m "Fix live radio and force fresh scripts v13.19"
          git push
