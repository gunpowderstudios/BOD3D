name: Align mobile hearts with compass v13.32
on:
  push:
    paths:
      - '.github/workflows/align-mobile-hearts-v1332.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align mobile hearts and bump version
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('css/patches.css')
          s=p.read_text()
          marker='/* v13.32 — mobile hearts aligned with compass */'
          rule='''\n\n/* v13.32 — mobile hearts aligned with compass */\n@media(max-width:800px){\n  #livesHud{\n    left:14px!important;\n    right:auto!important;\n    top:58px!important;\n    bottom:auto!important;\n    transform:none!important;\n  }\n}\n'''
          if marker not in s:
              p.write_text(s+rule)
          h=Path('index.html')
          t=h.read_text()
          t=re.sub(r'data-build-version="v[0-9.]+"','data-build-version="v13.32"',t,count=1)
          h.write_text(t)
      - name: Commit v13.32
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add css/patches.css index.html
          git commit -m "Align mobile hearts with compass v13.32"
          git push
