name: Promote desktop combat clarity v13.25
on:
  push:
    paths:
      - '.github/workflows/promote-desktop-combat-v13-25.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove desktop combat gradient and bump version
        shell: python
        run: |
          from pathlib import Path
          p=Path('css/dark-combat.css')
          s=p.read_text()
          old='background:linear-gradient(to bottom,rgba(0,0,0,.02) 0%,rgba(0,0,0,.04) 52%,rgba(0,0,0,.82) 76%,#000 100%)!important;'
          if old not in s: raise SystemExit('desktop combat gradient not found')
          p.write_text(s.replace(old,'background:transparent!important;',1))
          i=Path('index.html')
          h=i.read_text()
          h=h.replace('data-build-version="v13.24"','data-build-version="v13.25"',1)
          h=h.replace('css/dark-combat.css?v=11.45','css/dark-combat.css?v=13.25',1)
          i.write_text(h)
      - name: Commit
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add css/dark-combat.css index.html
          git commit -m "Remove desktop combat dark gradient v13.25"
          git push
