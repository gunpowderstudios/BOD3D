name: Fix combat commentary colours v13.36
on:
  push:
    paths:
      - '.github/workflows/fix-commentary-colours-v1336.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move commentary styles into loaded stylesheet
        shell: python
        run: |
          from pathlib import Path
          import re
          css=Path('css/patches.css')
          s=css.read_text()
          marker='/* v13.36 — active desktop combat commentary colours */'
          if marker not in s:
              s += '''\n\n/* v13.36 — active desktop combat commentary colours */\n@media(min-width:901px){\n body.combatActive .combatLatestCommentary{\n  margin-top:13px;\n  padding-top:11px;\n  border-top:1px solid rgba(255,255,255,.26);\n  color:#f3f3f3;\n  font-family:"Alegreya Sans",Arial,sans-serif;\n  font-size:15px;\n  font-weight:600;\n  line-height:1.25;\n  text-align:left;\n  text-shadow:0 1px 4px #000;\n  opacity:1;\n  transform:translateY(0);\n  pointer-events:none;\n }\n body.combatActive .combatLatestCommentary.commentaryIn{animation:combatCommentaryIn .32s ease-out}\n body.combatActive .combatLatestCommentary.heroHitComment{color:#58d26f!important}\n body.combatActive .combatLatestCommentary.monsterHitComment{color:#ef4050!important}\n body.combatActive .combatLatestCommentary.standOffComment{color:#b8b8b8!important}\n @keyframes combatCommentaryIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n}\n@media(max-width:900px){.combatLatestCommentary{display:none!important}}\n'''
          css.write_text(s)
          p=Path('index.html')
          t=p.read_text()
          t=re.sub(r'data-build-version="v[0-9.]+"','data-build-version="v13.36"',t,count=1)
          t=re.sub(r'css/patches\.css\?v=[^"\']+','css/patches.css?v=13.36',t,count=1)
          p.write_text(t)
      - name: Commit LIVE v13.36
        run: |
          git config user.name "Gunpowder"
          git config user.email "38918114+gunpowderstudios@users.noreply.github.com"
          git add css/patches.css index.html
          git commit -m "Fix active combat commentary colours v13.36"
          git push
