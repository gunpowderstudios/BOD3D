name: BOD3D About Update

on:
  push:
    paths:
      - .github/workflows/about-open-source-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update files
        run: |
          echo '' | base64 -d > /tmp/bod3d_update.py
          python3 /tmp/bod3d_update.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/game.js js/ui.js
          git commit -m 'Update About with BOD3D open-source information'
          git push origin main
