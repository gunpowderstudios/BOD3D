name: Deploy LIVE combat pulse fix v13.16
on:
  push:
    paths:
      - '.github/workflows/deploy-combat-pulse-v13-16.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy tested combat animation files
        run: |
          curl -fsSL https://raw.githubusercontent.com/gunpowderstudios/BOD3D-TEST/main/js/combat.js -o js/combat.js
          curl -fsSL https://raw.githubusercontent.com/gunpowderstudios/BOD3D-TEST/main/js/scene3d.js -o js/scene3d.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          s=re.sub(r'data-build-version="v[0-9.]+"','data-build-version="v13.16"',s,1)
          s=re.sub(r'js/game\.js\?[^"\']*','js/game.js?cache=20260807-combat-pulse-v1316',s)
          s=re.sub(r'js/combat\.js\?[^"\']*','js/combat.js?cache=20260807-combat-pulse-v1316',s)
          s=re.sub(r'js/scene3d\.js\?[^"\']*','js/scene3d.js?cache=20260807-combat-pulse-v1316',s)
          p.write_text(s)
          PY
      - name: Commit live v13.16
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/combat.js js/scene3d.js
          git commit -m "Live v13.16 fix combat swing and lunge" || exit 0
          git push
