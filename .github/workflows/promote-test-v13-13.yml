name: Promote TEST v13.13 to LIVE
on:
  push:
    paths:
      - '.github/workflows/promote-test-v13-13.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote tested game files
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/gunpowderstudios/BOD3D-TEST/main/js/game.js -o js/game.js
          curl -fsSL https://raw.githubusercontent.com/gunpowderstudios/BOD3D-TEST/main/js/combat.js -o js/combat.js
          curl -fsSL https://raw.githubusercontent.com/gunpowderstudios/BOD3D-TEST/main/js/scene3d.js -o js/scene3d.js
          curl -fsSL https://raw.githubusercontent.com/gunpowderstudios/BOD3D-TEST/main/index.html -o index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start='<!-- TEST-ONLY SEO START: remove this block when promoting index.html to LIVE -->'
          end='<!-- TEST-ONLY SEO END -->'
          if start in s and end in s:
              a=s.index(start)
              b=s.index(end,a)+len(end)
              s=s[:a]+s[b:]
          p.write_text(s)
          PY
          git rm .github/workflows/promote-test-v13-13.yml
          git config user.name 'Gunpowder Studios Deploy'
          git config user.email '38918114+gunpowderstudios@users.noreply.github.com'
          git add index.html js/game.js js/combat.js js/scene3d.js
          git commit -m 'Promote tested combat updates to LIVE v13.13'
          git push origin HEAD:main
