name: BOD3D LIVE v13.59 approved UI promotion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote approved TEST v13.59 UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              return s.replace(old,new,1)

          # index.html — LIVE version/cache markers + approved quest line only.
          p='index.html'; s=read(p)
          s=once(s,'data-build-version="v13.38"','data-build-version="v13.59"','LIVE build version')
          s=once(s,'css/main.css?v=12.83','css/main.css?v=13.59','main css cache')
          s=once(s,'css/patches.css?v=13.36','css/patches.css?v=13.59','patches css cache')
          s=once(s,'js/ui.js?v=12.78','js/ui.js?v=13.59','ui js cache')
          anchor='''    </div>\n    <div id="viewport"><canvas id="threeBoard"></canvas><div id="camera3d"><div id="world"></div></div></div>'''
          replacement='''    </div>\n    <div id="questObjective">Your quest — Find the Ring, defeat the Red Dragon and exit the dungeon!</div>\n    <div id="viewport"><canvas id="threeBoard"></canvas><div id="camera3d"><div id="world"></div></div></div>'''
          s=once(s,anchor,replacement,'quest objective insertion')
          if 'noindex' in s.lower():
              raise SystemExit('LIVE safety check failed: noindex found in index.html')
          write(p,s)

          # css/main.css — approved quest presentation + mobile-combat hide only.
          p='css/main.css'; s=read(p)
          old='''#topbar{right:52px}\n#viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;perspective:1200px}'''
          new='''#topbar{right:52px}\n#questObjective{\n  position:absolute;\n  left:50%;\n  top:56px;\n  z-index:19;\n  transform:translateX(-50%);\n  width:min(720px,calc(100% - 120px));\n  color:rgba(255,255,255,.82);\n  font-size:14px;\n  line-height:1.2;\n  font-weight:600;\n  letter-spacing:.02em;\n  text-align:center;\n  text-shadow:0 1px 4px #000,0 0 5px #000;\n  pointer-events:none;\n}\n@media(max-width:800px){\n  #questObjective{\n    top:51px;\n    width:calc(100% - 130px);\n    font-size:12px;\n    line-height:1.15;\n  }\n  body.combatActive #questObjective{display:none!important;}\n}\n#viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;perspective:1200px}'''
          s=once(s,old,new,'quest objective styles')
          write(p,s)

          # css/patches.css — approved desktop parchment top gap 40px only.
          p='css/patches.css'; s=read(p)
          s=once(s,'padding:7.5% 7.5% 6.5% 7.5%!important;','padding:40px 7.5% 6.5% 7.5%!important;','standard desktop parchment padding')
          s=once(s,'padding:7% 7.5% 5.8% 7.5%!important;','padding:40px 7.5% 5.8% 7.5%!important;','short desktop parchment padding')
          # Mobile parchment must remain unchanged.
          if 'padding:8.5% 12.5% 6.5% 14.5%!important;' not in s:
              raise SystemExit('mobile parchment safety check failed')
          write(p,s)

          # js/ui.js — LIVE visible build marker only; preserve existing behaviour.
          p='js/ui.js'; s=read(p)
          s=once(s,'// Live v13.48 — approved TEST UI fixes promoted to Live.','// Live v13.59 — approved TEST UI changes promoted to Live.','LIVE ui comment')
          s=once(s,"const version='v13.48';","const version='v13.59';",'LIVE ui version')
          write(p,s)

          # Final validation of intended LIVE state.
          idx=read('index.html'); main=read('css/main.css'); patches=read('css/patches.css'); ui=read('js/ui.js')
          assert idx.count('id="questObjective"') == 1
          assert 'Your quest — Find the Ring, defeat the Red Dragon and exit the dungeon!' in idx
          assert 'noindex' not in idx.lower()
          assert main.count('body.combatActive #questObjective{display:none!important;}') == 1
          assert patches.count('padding:40px 7.5% 6.5% 7.5%!important;') == 1
          assert patches.count('padding:40px 7.5% 5.8% 7.5%!important;') == 1
          assert 'padding:8.5% 12.5% 6.5% 14.5%!important;' in patches
          assert 'data-build-version="v13.59"' in idx
          assert 'css/main.css?v=13.59' in idx
          assert 'css/patches.css?v=13.59' in idx
          assert 'js/ui.js?v=13.59' in idx
          assert "const version='v13.59';" in ui
          print('LIVE v13.59 validated: approved quest + parchment changes only')
          PY

      - name: Commit approved LIVE v13.59
        shell: bash
        run: |
          rm -f .github/workflows/promote-v1359.yml
          git config user.name "BOD3D LIVE updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html css/main.css css/patches.css js/ui.js .github/workflows/promote-v1359.yml
          git diff --cached --check
          git commit -m "v13.59: promote approved quest and parchment UI to live"
          git push
